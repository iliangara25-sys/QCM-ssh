const S1=[
{th:"Épistémologie",q:"Parmi les propositions suivantes, laquelle (lesquelles) est (sont) exacte(s) ?",p:[
["L’épistémologie étudie les savoirs et permet de définir la maladie de façon à mettre tous les spécialistes d’accord.",0,"Elle est une réflexion critique sur la production des connaissances médicales ; elle ne garantit aucun accord entre spécialistes (le débat naturalisme/normativisme persiste)."],
["Idéalement, illness et sickness devraient se superposer car ils permettent de trouver la pathologie derrière la maladie du patient.",0,"Ce sont maladie (illness) et pathologie (disease) qui devraient idéalement se superposer. Sickness = dimension sociale."],
["Le terme « illness » définit la dimension sociale de la maladie (être malade pour les autres).",0,"C’est la définition de SICKNESS. Illness = vécu de l’individu."],
["Le terme « disease » = « maladie », défini par un dysfonctionnement biologique ; c’est un concept pratique et descriptif.",0,"Disease est bien un dysfonctionnement biologique, mais c’est un concept THÉORIQUE et descriptif (pas pratique). Le pratique = illness."],
["Le terme « illness » = « maladie » : état indésirable pour l’individu car il souffre ou car son état restreint sa liberté.",1,"Définition exacte : concept pratique et axiologique, vécu subjectif de l’individu."]]},
{th:"Épistémologie",q:"Parmi les propositions suivantes, laquelle (lesquelles) est (sont) exacte(s) ? (items renommés A à E)",p:[
["Naturalisme : maladie reconnue uniquement si dysfonctionnement biologique ET souffrance. Normativisme : maladie définie directement à partir de la souffrance vécue.",0,"Le naturalisme retient le dysfonctionnement biologique comme critère principal, sans exiger la souffrance. Seule la 2e phrase est vraie → item faux."],
["La valeur ou la norme est subjective (jugement humain, opinion sociale) ; elle se rapproche d’illness et sickness.",1,"Valeur = jugement/préférence, subjectif. Illness (vécu) et sickness (regard social) relèvent des valeurs."],
["Le fait se constate/se mesure, relié à disease ; il dépend aussi de l’observateur.",0,"Le fait est objectif : il NE change PAS d’un observateur à l’autre (ex : un taux)."],
["« Hyperthyroïdie (TSH basse) sans souffrance ni symptôme » illustre le naturalisme.",1,"Dysfonctionnement biologique (fait) sans souffrance : le naturalisme y voit une maladie, pas le normativisme."],
["La critique de la biomédecine montre que la maladie est simplement définie par des faits objectifs.",0,"C’est l’inverse : la critique souligne que la maladie n’est pas que des faits, mais aussi des valeurs (individuelles et sociales)."]]},
{th:"Médicalisation",q:"Parmi les propositions suivantes, laquelle (lesquelles) est (sont) exacte(s) ?",p:[
["Un certificat médical pour une pratique sportive fait entrer le phénomène dans la pathologisation.",0,"Le sport n’est pas une pathologie : on est dans la médicalisation (le médecin intervient), pas la pathologisation."],
["La transidentité déclarée entre dans le cadre de la médicalisation.",1,"Prise en charge médicale d’un phénomène sans que ce soit forcément une maladie : médicalisation."],
["La fatigue intense et prolongée au travail entre dans le cadre de la pathologisation.",1,"On lui attribue un caractère pathologique (type burn-out) → pathologisation (réponse retenue par déduction)."],
["La médecine prédictive et l’IA peuvent entraîner une surmédicalisation.",1,"Détecter des risques / anomalies de plus en plus tôt étend le champ de la médecine."],
["La veillesse entre aujourd’hui, avec la gériatrie, dans la pathologisation.",0,"La vieillesse n’est pas une maladie : la gériatrie relève de la médicalisation."]]},
{th:"Médicalisation",q:"Parmi les propositions suivantes, laquelle (lesquelles) est (sont) exacte(s) ?",p:[
["La distinction normal/pathologique peut avoir des conséquences économiques, sociales et juridiques.",1,"Remboursement des soins, arrêt de travail, responsabilité pénale, rôle social du malade…"],
["Un individu peut présenter une disease sans avoir conscience de son état pathologique.",1,"Ex : cancer à un stade précoce : dysfonctionnement sans souffrance ressentie."],
["Dans une approche normativiste, le contexte culturel peut influencer la qualification d’un état comme maladie.",1,"Les valeurs et normes varient selon les époques et les sociétés (ex : myopie)."],
["Illness et disease se superposent systématiquement.",0,"Ils peuvent être dissociés : cancer précoce (disease sans illness), hypersensibilité aux ondes (illness sans disease)."],
["Le normativisme risque d’étendre excessivement le domaine d’action de la médecine.",1,"Fondé sur la souffrance/les valeurs, il peut faire entrer trop de situations dans le champ médical."]]},
{th:"Morale, éthique, droit",q:"Parmi les propositions suivantes, laquelle (lesquelles) est (sont) exacte(s) ?",p:[
["La morale est un ensemble collectif de règles qui s’intéresse à la manière de poser correctement les questions.",0,"Poser correctement les questions = ÉTHIQUE. La morale = règles collectives sur le mode de l’injonction."],
["Dans la société, le droit est rationnel et non consensuel.",0,"Le droit est rationnel ET consensuel (résultat d’une réflexion commune)."],
["Interdiction de nuire, de mentir, de fuir ses responsabilités : exemples de règles morales.",1,"Injonctions « tu dois / tu ne dois pas ». Autres ex : interdit de l’homicide, du mensonge, de l’inceste."],
["Les lois sur la fin de vie et les droits des malades ont été adoptées à la suite de réflexions éthiques.",1,"L’éthique contribue à transformer le droit (ex : lois de bioéthique)."],
["Une fois adoptée, une loi ne peut plus être remise en cause ou modifiée.",0,"Le droit évolue, justement sous l’effet des réflexions éthiques."]]},
{th:"Courants éthiques",q:"Parmi les propositions suivantes, laquelle (lesquelles) est (sont) exacte(s) ? (items renommés A à E)",p:[
["Le principlisme est un syncrétisme athéorique s’appuyant sur des principes issus d’un même courant philosophique.",0,"Syncrétisme athéorique = mélange de PLUSIEURS courants parfois contradictoires, pas d’un seul."],
["Selon la situation, certains repères du principlisme ne s’accordent pas.",1,"Les principes peuvent entrer en conflit (ex : autonomie vs bienfaisance) → « éthique de conflits »."],
["Le conséquentialisme s’intéresse aux conséquences d’un acte ; l’utilitarisme maximise le bonheur du plus grand nombre : c’est une forme de conséquentialisme.",1,"Utilitarisme (Bentham, Mill) = branche du conséquentialisme."],
["Les grands principes du principlisme : respect de l’autonomie, justice et bienfaisance.",0,"Incomplet : il y en a 4 (autonomie, bienfaisance, NON-MALFAISANCE, justice)."],
["Selon l’éthique conséquentialiste, il faut respecter le refus d’un patient car respecter son autonomie est une bonne conséquence.",0,"Respecter l’autonomie est un principe du principlisme ; le raisonnement proposé n’est pas la logique conséquentialiste (réponse retenue par déduction)."]]},
{th:"Courants éthiques",q:"Parmi les propositions suivantes, laquelle (lesquelles) est (sont) exacte(s) ?",p:[
["L’éthique de la vertu s’intéresse principalement au caractère moral de l’agent pour apprécier la moralité d’une action.",1,"Aristote : « QUI je dois être ? » (caractère, vertus, juste milieu)."],
["La phronèsis (Aristote) = appliquer une règle morale universelle indépendamment de la situation.",0,"C’est l’inverse : sagesse pratique, adaptation à la singularité de la situation (« règle molle »)."],
["L’éthique déontologique kantienne juge la moralité d’une action à partir de ses conséquences.",0,"Kant : on juge selon l’INTENTION et le devoir universel, pas les conséquences."],
["La déontologie médicale = réflexion sur le devoir moral permettant de déterminer la règle à suivre.",0,"Piège : cela décrit l’éthique déontologique. Déontologie médicale = règles professionnelles fixées par l’Ordre des médecins."],
["Selon Habermas, une discussion éthique doit viser un consensus entre les parties.",1,"Éthique de la discussion : consensus (pas compromis), sincérité, symétrie de parole."]]},
{th:"Courants éthiques",q:"Une équipe médicale doit choisir une conduite à tenir ; plusieurs professionnels défendent des points de vue différents. Parmi les propositions suivantes, laquelle (lesquelles) est (sont) exacte(s) ?",p:[
["Les participants s’expriment librement, sincèrement et équitablement, mais le chef de service n’est pas d’accord avec la décision finale : la procédure n’est pas éthiquement correcte.",0,"Éthique procédurale : seule compte la qualité du processus (sincérité + symétrie). Procédure bonne → décision moralement correcte."],
["Si le chef de service renonce à ses examens pour aller dans le sens de ses collègues, c’est un consensus.",0,"Il cède une partie de « soi » : c’est un compromis, pas un consensus (accord réel de toutes les parties)."],
["Un médecin qui adapte sa conduite à la situation mobilise une forme de phronèsis.",1,"Sagesse pratique d’Aristote : s’adapter à la singularité du cas."],
["Pour Kant, une action peut être morale uniquement parce qu’elle produit les meilleures conséquences.",0,"Logique conséquentialiste, pas kantienne."],
["Deux conduites peuvent être rationnellement défendables tout en reposant sur des valeurs éthiques différentes.",1,"Pluralisme éthique : chaque courant (vertu, devoir, conséquences…) fournit des arguments défendables."]]},
{th:"Sémantique",q:"Parmi les propositions suivantes, laquelle (lesquelles) est (sont) exacte(s) ? (peau et annexes)",p:[

["Le corpuscule désigne un gros corps.",0,"Suffixe diminutif : PETIT corps."],
["Un chromosome est un organisme du noyau qui fixe le chrome.",0,"chromo = couleur, soma = corps : « corps coloré » (se colore par les colorants)."],
["Le pilosisme est le développement anormal de poils.",1,"pilo- = poil ; -isme = état. (Écrit « pillosisme » dans l’énoncé : faute de frappe.)"],
["Le follicule désigne un petit sac.",1,"Du latin folliculus, diminutif de follis (sac)."]]},
{th:"Sémantique",q:"Parmi les propositions suivantes, laquelle (lesquelles) est (sont) exacte(s) ?",p:[
["Le radical cut- signifie « couper ».",0,"cut- = PEAU (cutané). « Couper » = -tomie / cis-."],
["Une pelade est une maladie de la peau caractérisée par la chute de cheveux.",1,"Perte de cheveux/poils en plaques (alopécie)."],
["L’hypoderme est la couche superficielle de la peau.",0,"hypo- = sous : couche la plus PROFONDE (épiderme = superficielle)."],
["Un érysipèle est une infection bactérienne de la peau qui cause des plaques rouges.",1,"Dermo-hypodermite bactérienne aiguë, plaque rouge inflammatoire."],
["Un pore est un très petit orifice à la surface de la peau par où s’écoulent sueur et sébum.",1,"Orifice des glandes sudoripares et sébacées."]]},
{th:"Sémantique",inv:1,q:"Parmi les propositions suivantes, laquelle (lesquelles) est (sont) INEXACTE(s) ? (cochez « Inexacte » si l’item est faux)",p:[

["La sudation désigne la sécrétion de sueur par les glandes destinées à cet effet.",0,"Exact."],
["Le radical hydr(o)- désigne la sueur.",1,"INEXACT : hydr(o)- = EAU ; la sueur = hidr(o)- (sans y)."],
["Une hypersudorrhée est une affection caractérisée par une sécrétion excessive de sueur.",0,"Exact (hyper + sudor + rhée)."],
["Les glandes hidropares produisent et sécrètent la sueur.",0,"Exact (hidro + -pare : qui produit)."]]},
{th:"Sémantique",q:"Parmi les propositions suivantes, laquelle (lesquelles) est (sont) exacte(s) ? (squelette)",p:[

["Une douleur au niveau du sternum peut être appelée sternalgie.",1,"stern(o)- + -algie (douleur)."],

const A=[

["Il définit la maladie comme un dysfonctionnement biologique mesurable.",1,"Définition centrale du naturalisme (fait objectif, mesurable)."],
["Il affirme que toute maladie comporte un stade asymptomatique.",0,"Affirmation inventée : le naturalisme ne dit pas cela."],

<tr><td>Sens</td><td>Maladie vécue : état indésirable, souffrance ou liberté restreinte</td><td>Pathologie : dysfonctionnement biologique</td><td>Dimension sociale : être reconnu malade par la société</td></tr>
<tr><td>Concept</td><td>Pratique + axiologique</td><td>Théorique + descriptif</td><td>Axiologique</td></tr>
<tr><td>Acteur</td><td>Individu (I)</td><td>Docteur (D)</td><td>Société (S)</td></tr></table></div>
<ul><li><b>Fait</b> : se constate/mesure, objectif, ne change pas d’un observateur à l’autre → disease.</li><li><b>Valeur/norme</b> : jugement, subjectif → illness + sickness.</li><li>Fait et valeur parfois incompatibles : cancer précoce (disease sans illness) ; hypersensibilité aux ondes (illness sans disease).</li></ul>
<h3>Naturalisme vs normativisme</h3><ul><li><b>Naturalisme</b> : critère = dysfonctionnement biologique (objectif) ; axiologique secondaire. Ex : favisme, hyperthyroïdie asymptomatique.</li><li><b>Normativisme</b> : critère = souffrance/valeurs ; pas de disease sans illness. Ex : stérilité, myopie. Risque : étendre trop le champ de la médecine.</li></ul></div>
<div class="c"><h2>Médicalisation vs pathologisation</h2><ul><li><b>Médicalisation</b> : faire passer un phénomène dans le domaine médical (grossesse, calvitie, sport intense, vieillesse, refus de vieillir). Peut masquer des normes sociales → contrôle social.</li><li><b>Pathologisation</b> : étape suivante, on officialise un caractère pathologique (TDAH, addiction aux écrans, anxiété, dépression). Peut être positive (dépression) ou négative (comportements déviants).</li><li>Critiques : relativité historique/sociale (drapétomanie, schizophrénie torpide), diviser normaux/anormaux, pouvoir social du médecin.</li></ul></div>
<div class="c"><h2>🩺 Définition de la maladie (fiche SSHC 2025-26)</h2>
<h3>1. Introduction : pourquoi définir la maladie ?</h3><ul><li>La perception d’une maladie influence sa prise en charge ; il n’est pas évident de savoir si une situation relève de la maladie.</li><li><b>Épistémologie</b> = branche de la philosophie sur la théorie de la connaissance médicale ; elle se demande « qu’est-ce que la maladie ? » à partir de <b>cas limites</b>.</li><li>Cas limites : <b>fibromyalgie</b> (douleurs musculo-articulaires inexpliquées, touche surtout des femmes victimes de violences sexuelles) · <b>Koro</b> (anxiété extrême : peur que le pénis se rétracte dans l’abdomen, épidémies de Koro) · <b>orthorexie</b> (addiction à manger sainement, risque de carences) · <b>syndrome du mal du débarquement</b> (mal de transport > 1 mois, examens normaux) · <b>hypersensibilité électromagnétique</b> (symptômes attribués aux ondes, aucune preuve scientifique) · <b>écoanxiété</b> intense.</li><li><b>Exemples réfutés</b> (la définition varie dans l’histoire) : <b>schizophrénie torpide</b> (URSS, années 60 : inadaptation sociale sans symptôme psychotique, internement forcé des opposants) · <b>dysesthésie éthiopique</b> (inventée par le médecin raciste S. Cartwright au 19e s.) · <b>chlorose</b> (19e s. : pâleur, « maladie féminine » ; aujourd’hui anémie) · gaucherie pathologique · question ouverte : l’hypercholestérolémie est-elle une maladie ?</li></ul>
<h3>2. Illness / disease / sickness</h3><ul><li>En français « maladie » recouvre plusieurs notions ; l’anglais les distingue.</li><li><b>Illness</b> : état indésirable pour l’individu, préjudice/souffrance, autonomie restreinte (ex : handicap). Concept <b>pratique</b> (action entravée) et <b>axiologique</b> (valeurs). Dépend de l’individu lui-même (être enfermé dans une salle n’est pas une maladie).</li><li><b>Disease</b> : dysfonctionnement de l’organisme (ce qui intéresse le plus le médecin). Concept <b>théorique</b> et <b>descriptif</b>, sans jugement de valeur ; décrit un état dont le patient peut ne pas avoir conscience ; variable historiquement.</li><li><b>Sickness</b> : dimension sociale, jugement de la société, « être un malade » (conséquences sociales).</li><li><b>Idéal</b> : illness et disease devraient se superposer (patient qui souffre → le médecin trouve la pathologie).</li><li>Disease = objective · Illness = subjective · Sickness = sociale (subjective). Désaccord théorique profond : tensions entre le social et le médical ; il porte sur la distinction fait/valeur.</li></ul>
<h3>Disease sans illness / illness sans disease</h3><ul><li><b>Hypertension</b> : disease (facteur de risque d’AVC), pas d’illness (asymptomatique) ; sickness ? (questions économiques).</li><li><b>Ostéopénie</b> (ménopause) : risque de fractures, asymptomatique.</li><li><b>Cancer précoce</b> : dysfonctionnement avéré, asymptomatique → faut-il le prendre en charge dès le moindre facteur de risque ? (questions éthiques)</li><li><b>Prédiabète</b> (1,10 à 1,25 g/L) : pas de plainte donc pas d’illness.</li><li><b>Fibromyalgie</b> : illness (souffrance réelle), pas de dysfonctionnement identifié (disease).</li></ul>
<h3>3. Fait et valeur</h3><ul><li><b>Fait</b> : se constate, se mesure (taux de cortisol, arythmie) → approche centrée sur la <b>disease</b>.</li><li><b>Valeur (norme)</b> : jugement humain, préférence (bon/mauvais), pas objectif → centrée sur <b>illness</b> et <b>sickness</b>. Exemples : monter un escalier avec peine à 25 ans ; se promener nu dans la rue en criant.</li><li>Idéal : fait et valeur se superposent. Question fondamentale : la frontière sain/pathologique repose-t-elle sur les faits ou sur les valeurs ?</li></ul>
<h3>Naturalisme vs normativisme (tradition anglo-saxonne)</h3><div class="tbl"><table><tr><th></th><th>Naturalisme</th><th>Normativisme</th></tr><tr><td>Critère</td><td>Dysfonctionnement biologique ; valeurs secondaires, issues du dysfonctionnement</td><td>Valeurs, état de souffrance du patient (point de départ)</td></tr><tr><td>Illness/disease</td><td>Les distingue ; illness « trop large » (beaucoup de souffrances ne sont pas des maladies)</td><td>Pas de disease sans illness ; l’écart à la norme importe peu</td></tr><tr><td>Exemples</td><td>Cancer, tuberculose = maladies même sans souffrance ; myopie et grossesse ≠ maladies. <b>Phénylcétonurie</b> : déficit en enzyme → accumulation de phénylalanine ; maladie même sans symptôme</td><td>Myopie (importante pour un employé de bureau du 21e s., sans importance pour un paysan du 18e), stérilité. PCU sans symptôme (culture sans phénylalanine) = pas une maladie</td></tr><tr><td>Problème</td><td>Conditions préjudiciables sans disease (grossesse non désirée) prises en charge par le médecin ; comment fixe-t-on les valeurs ?</td><td>Impact culturel fort (varie selon cultures/époques) ; risque d’extension excessive du domaine de la médecine</td></tr></table></div>
<h3>4. Enjeux de la médicalisation</h3><ul><li><b>Conséquences pour toute la société</b> : économique (remboursement des soins), politique (selon le pays), juridique (responsabilité de la personne, ex : troubles psychiatriques). Risque : extension infinie du domaine de la maladie.</li><li><b>Médicalisation</b> : un phénomène passe dans le domaine médical, contrôlé par les médecins avec une prise en charge spécifique. Récente (années 60-70 : on meurt à l’hôpital). Ex : <b>grossesse, mort</b>. Notion critique née dans les années 60 (historiens et sociologues, antipsychiatrie en Grande-Bretagne, <b>Michel Foucault</b> en France).</li><li><b>Pathologisation</b> : le phénomène est d’emblée perçu comme médical (on ne se demande plus si c’est la compétence du médecin). Positive : <b>dépression</b> (20e s., légitime la souffrance, permet la guérison). Négative : <b>schizophrénie torpide</b>. Médicalisations discutables : ménopause, alcoolisme, masturbation, homosexualité (maladie jusqu’en 1973). Ici la maladie se définit par la valeur (sickness) : « on appelle maladie ce qui dérange » ; il ne suffit pas d’être factuel pour être neutre.</li><li><b>Dangers</b> : relativité historique et sociale (le discours médical peut déguiser des normes sociales) · <b>séparation de la société</b> entre normaux et anormaux (Foucault) · <b>contrôle social</b> des comportements déviants (médicaliser ce qui dérange pour ne pas troubler l’ordre public) · <b>dépolitisation</b> : ex. diagnostic systématique d’hyperactivité chez les enfants aux USA → surmédication, on ne cherche plus les causes (écrans, système éducatif…).</li><li>Nuance : critique du point de vue accusateur ; la médicalisation est un changement global des représentations sociales et la profession médicale n’en est que marginalement responsable.</li></ul></div>
<div class="c"><h2>Morale, éthique, droit</h2><ul><li><b>Morale</b> : règles collectives, injonction (« tu dois / tu ne dois pas »).</li><li><b>Éthique</b> : argumente la pertinence de la règle (que faire et pourquoi) ; engagement personnel et continu ; « poser correctement les questions » ; transforme le droit (lois de bioéthique).</li><li><b>Droit</b> : rationnel + consensuel ; normes instituées et sanctionnables ; s’impose à tous.</li></ul></div>

<tr><td><b>Procédural</b> (Habermas)</td><td>La procédure est-elle correcte ?</td><td>Qualité du processus ; <b>consensus</b> (≠ compromis) ; sincérité + symétrie de parole</td></tr>

s médico-légales (nécropsie auparavant car nécr- désignait le cadavre)."], ["Biopsie", "Prélèvement tissulaire ou organique sur le tissu vivant en vue du diagnostic."], ["Scop-", "Observer, examiner."], ["Endo-", "A l’intérieur."], ["Endoscopie", "Méthode d’exploration visuelle d’une cavité."], ["Coloscopie", "Endoscopie du colon (examen visuel) via une sonde appelée coloscope."]]}, {"l": "Sém. 2", "c": "Paupière", "r": [["Palpèbr-, tars-, bléphar-", "Paupière."], ["Palpébral", "Relatif à la paupière."], ["Blépharite", "Inflammation du bord libre des paupières."], ["Tarse", "- Lame de tissu conjonctif de la paupière qui maintient la paupière tendue. (Nommée ainsi car on lui a longtemps attribué les écoulements de l’œil) - Ensemble de 7 os courts en double rangée, à la partie postérieure du pied. - (Désigne aussi la clef à fromage qui est une grille sur laquelle on laisse le fromage s’égoutter.)"], ["-rraphie", "Couture, suture. (avec ou sans h)"], ["Tarsorraphie", "Couture des paupières pour préserver l’œil du contact avec l’air après une"]]}, {"l": "Sém. 2", "c": "Cornée, iris et pupille", "r": [["Kérat-", "Cornée."], ["Kératite", "Inflammation de la cornée."], ["Iris-, irid-", "Iris, arc en ciel en grec."], ["Ect-", "Hors de."], ["-tomie -cis", "Section."], ["Ectomie", "Ablation."], ["Iridectomie", "Excision d’une partie de l’iris."], ["Pupilla-, cor-", "Pupille (Nommée ainsi car on verrait une petite poupée se refléter dans la pupille)"], ["Anisocorie", "Absence d’égalité de la taille des pupilles. - Peut permettre de diagnostiquer la syphilis tertiaire (manifestation la plus tardive quand il y a des lésions) - On réalise l’examen en masquant un œil et en projetant de la lumière sur l’autre ce qui provoque la rétraction des pupilles. Lorsque l’on démasque l’œil, si la pupille ne s’est pas rétractée comme la première, il y a une anisocorie."]]}, {"l": "Sém. 2", "c": "Larmes", "r": [["Lacrym-, dacry-", "Larmes ➔ lacrymal."], ["Gène-", "Qui génère, qui produit."], [  les tonsilles, ne plus dire amygdales. Nous avons des tonsilles pharyngiennes (végétations), palatines (amygdales) et cérébelleuses."], ["Amygdalé", "Amande."], ["-ide", "Parenté, forme de."], ["Amygdaloïde", "Qui a une forme d’amande."], ["Corps amygdaloïdes", "Groupe de noyaux dans le lobe temporal."], ["Tonsillectomie", "Ablation des tonsilles palatines."], ["Lingu-, gloss-", "Langue."], ["-plégie", "Paralysie."], ["Glossoplégie", "Paralysie de la langue."], ["Sub-", "Dessous, sous"], ["Sublingual", "Situé sous la langue."], ["Labi-, cheil-", "Lèvres ➔ labial."], ["Paralysie labio-glosso- pharyngée", "Paralysie relative aux lèvres, langue, pharynx et larynx."], ["Cheilophagie", "Tic qui consiste à se mordiller les lèvres."]]}, {"l": "Sém. 2", "c": "Manger et boire", "r": [["Gust-, gueusie-", "Le goût."], ["Gustatif", "Relatif au goût."], ["Gustation", "Perception des saveurs."], ["Caco", "Mauvais."], ["Cacogeusie", "Trouble neurologique qui donne une sensation de goût désagréable, pendant ou en dehors de l’absorption d’aliments."], ["-phag(i)e, -vore", "Manger ➔ Œsophage."], ["Carnivore", "Qui mange de la chair."], ["Cellule neurophage", "Cellule capable de phagocyter les cellules nerveuses."], ["Neuro-", "Le nerf"], ["-cyte-", "La cellule"], ["Poto-", "Boire."], ["Potomanie", "En psychopathologie : besoin de boire abondamment."], ["Dipso-", "Avoir soif."], ["Dipsomanie", "Addiction morbide à boire de grandes quantités d’un liquide toxique en général alcoolisé, par crises souvent précédées d’une phase de tristesse."], ["Adipsie", "Diminution ou perte du besoin de boire."], ["Emet-", "Vomir, plus exactement qui fait vomir : Substance émétique = substance qui a des propriétés vomitives"], ["Maxill-, gnath-", "Mâchoire."], ["Maxillaire", "Os maxillaire."], ["Gnathalgie", "Douleur, névralgie de la mâchoire."], ["Génio-", "Menton."], ["Génioglosse", "Muscle qui s’étend de la face interne et antérieure du menton jusqu’à la base de la langue. - Un de chaque côté de la function normalize(data){
 if(Array.isArray(data))data={qcm:data,cards:[]};
 if(!data||typeof data!=="object")throw Error("Le contenu doit être un objet JSON.");
 const qcm=(data.qcm||data.questions||[]),cards=(data.cards||data.flashcards||[]);
 if(!Array.isArray(qcm)||!Array.isArray(cards))throw Error("Les champs qcm et cards doivent être des listes.");
 if(qcm.length>2000||cards.length>10000)throw Error("Fichier trop volumineux.");
 return {qcm:qcm.map((q,n)=>{
  if(!q||typeof q.q!=="string"||!q.q.trim()||!Array.isArray(q.p)||q.p.length<2||q.p.length>5)throw Error("QCM "+(n+1)+" : question ou propositions invalides (2 à 5 attendues).");
  return {s:String(q.s||"Mes ajouts").slice(0,100),th:String(q.th||"SSH").slice(0,100),q:q.q.slice(0,2000),inv:q.inv?1:0,p:q.p.map((p,k)=>{
   if(!Array.isArray(p)||typeof p[0]!=="string"||p[0].trim()===""||![0,1,false,true].includes(p[1]))throw Error("QCM "+(n+1)+", proposition "+(k+1)+" invalide.");
   return [p[0].slice(0,2500),Number(p[1]),String(p[2]||"").slice(0,4000)]
  })}
 }),cards:cards.map((c,n)=>{
  if(!c||typeof c.t!=="string"||!c.t.trim()||typeof c.d!=="string"||!c.d.trim())throw Error("Flashcard "+(n+1)+" invalide.");
  return {l:String(c.l||"Mes ajouts").slice(0,100),c:String(c.c||"SSH").slice(0,100),t:c.t.slice(0,1000),d:c.d.slice(0,5000)}
 })};
}

// Ajouts publies dans le depot GitHub : synchronises entre appareils.
async function chargerQCMPublies(){
 try {
  const response=await fetch("./qcm-ajouts.json",{cache:"no-store"});
  if(!response.ok)throw new Error("HTTP "+response.status);
  const n=normalize(await response.json());
  n.qcm.forEach(q=>{q.id=ALL.length;ALL.push(q)});
  n.cards.forEach(c=>CARDS.push({...c,id:CARDS.length}));
  Q=F==="Tout"?ALL:ALL.filter(q=>q.s===F);
  show(1);
 } catch(error){console.warn("Ajouts publics non charges :",error);}
}
chargerQCMPublies();
